 name: Release Build

  on:
    push:                                                                                                                  tags:
        - 'v*'                                                                                                           workflow_dispatch:

  permissions:
    contents: write

  jobs:
    build:
      strategy:
        fail-fast: false
        matrix:
          include:
            - platform: windows-latest
              target: x86_64-pc-windows-msvc
            - platform: ubuntu-22.04
              target: x86_64-unknown-linux-gnu
            - platform: macos-latest
              target: aarch64-apple-darwin
            - platform: macos-13
              target: x86_64-apple-darwin
      runs-on: ${{ matrix.platform }}
      steps:
        - uses: actions/checkout@v4
        - uses: dtolnay/rust-toolchain@stable
          with:
            targets: ${{ matrix.target }}
        - uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Linux deps
          if: matrix.platform == 'ubuntu-22.04'
          run: |
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev
  libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
        - run: npm ci
        - run: cargo install tauri-cli
        - run: cargo tauri build --target ${{ matrix.target }}
          env:
            TAURI_SIGNING_PRIVATE_KEY: ''
        - uses: actions/upload-artifact@v4
          with:
            name: build-${{ matrix.target }}
            path: |
              src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
              src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
              src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
              src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
              src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
              src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

    release:
      needs: build
      runs-on: ubuntu-latest
      if: startsWith(github.ref, 'refs/tags/v')
      steps:
        - uses: actions/download-artifact@v4
          with:
            path: artifacts
        - uses: softprops/action-gh-release@v2
          with:
            generate_release_notes: true
            files: |
              artifacts/**/*.exe
              artifacts/**/*.msi
              artifacts/**/*.AppImage
              artifacts/**/*.deb
              artifacts/**/*.rpm
              artifacts/**/*.dmg
